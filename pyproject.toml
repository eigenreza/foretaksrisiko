[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foretaksrisiko"
version = "0.1.0"
description = "Unusual patterns among Norwegian limited companies, from open register data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reza Azad Gholami" }]
dependencies = [
  "httpx>=0.28,<1",
  "ijson>=3.3",
  "pyarrow>=19",
  "typer>=0.15",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6",
  "scikit-learn>=1.6,<1.7",
  "pandas>=2.2",
  "scipy>=1.13",
  "shap>=0.48",
]

[project.optional-dependencies]
spark = ["pyspark==4.2.0", "delta-spark==4.4.1"]
databricks = ["databricks-sdk>=0.40"]
ml = ["mlflow>=3"]
figures = ["matplotlib>=3.9"]
app = ["streamlit>=1.50", "joblib>=1.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
foretaksrisiko = "foretaksrisiko.cli:app"
foretaksrisiko-job = "foretaksrisiko.cli:job_main"

[tool.hatch.build.targets.wheel]
packages = ["src/foretaksrisiko"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "foretaksrisiko/configs/default.yaml"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL text inside these modules cannot be wrapped by the formatter.
"src/foretaksrisiko/lakehouse/features.py" = ["E501"]
"src/foretaksrisiko/lakehouse/labels.py" = ["E501"]
"src/foretaksrisiko/lakehouse/outcomes.py" = ["E501"]
"src/foretaksrisiko/lakehouse/gold.py" = ["E501"]
"src/foretaksrisiko/lakehouse/silver.py" = ["E501"]
"src/foretaksrisiko/quality/checks.py" = ["E501"]
"src/foretaksrisiko/models/train.py" = ["E501"]
"src/foretaksrisiko/models/lakehouse_train.py" = ["E501"]
"tests/test_models.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: needs a local Spark with Java; skipped when unavailable"]
