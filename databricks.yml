# Databricks Asset Bundle for the foretaksrisiko pipeline (Free Edition, serverless only).
#
# Authenticate once with `databricks auth login --host <workspace> --profile foretaksrisiko`.
# Alerts go to the deploying user unless another address is passed outside the repository:
#   BUNDLE_VAR_alert_email=... databricks bundle deploy -t dev
bundle:
  name: foretaksrisiko

variables:
  catalog:
    description: Unity Catalog catalog that holds all schemas
    default: workspace
  schema_prefix:
    description: Prefix for the bronze, silver, gold, monitoring and landing schemas
    default: foretaksrisiko_
  alert_email:
    description: Address for job failure and alert notifications. Never stored in the repository.
    default: ${workspace.current_user.userName}
  snapshot_id:
    description: Snapshot index to process when the job runs without an explicit parameter
    default: "1"

artifacts:
  wheel:
    type: whl
    path: .
    build: uv build --wheel

# Schemas are created by the pipeline code (CREATE SCHEMA IF NOT EXISTS) and the landing volume by
# `foretaksrisiko lakehouse upload`, so the bundle owns only the jobs.
resources:
  jobs:
    # One run per snapshot: landing files to bronze, silver and gold with quality checks, features
    # for both designs, scoring with the champion, drift monitoring, and an alert stage that fails
    # (and so sends the email below) when a threshold is breached.
    snapshot_pipeline:
      name: foretaksrisiko snapshot pipeline
      description: Landing files to gold, champion scores and monitoring for one snapshot.
      parameters:
        - name: snapshot_id
          default: ${var.snapshot_id}
        - name: reference_snapshot_id
          # 0 means the champion's training snapshot, or the previous snapshot without a champion.
          default: "0"
        - name: scenario
          # default, or a named threshold set from configs/default.yaml such as simulated_breach.
          default: default
      email_notifications:
        on_failure:
          - ${var.alert_email}
      # Weekly, after the Monday acquisition. Development mode deploys schedules paused.
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: Europe/Oslo
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            # Serverless environment version 4 runs Python 3.12, matching requires-python.
            client: "4"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters: ["lakehouse", "bronze", "--snapshot", "{{job.parameters.snapshot_id}}"]
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters: ["lakehouse", "silver", "--snapshot", "{{job.parameters.snapshot_id}}"]
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters: ["lakehouse", "gold", "--snapshot", "{{job.parameters.snapshot_id}}"]
        - task_key: features
          depends_on:
            - task_key: gold
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters: ["lakehouse", "features", "--snapshot", "{{job.parameters.snapshot_id}}"]
        - task_key: score
          depends_on:
            - task_key: features
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters: ["lakehouse", "score", "--snapshot", "{{job.parameters.snapshot_id}}"]
        - task_key: monitor
          depends_on:
            - task_key: score
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters:
              - "lakehouse"
              - "monitor"
              - "--snapshot"
              - "{{job.parameters.snapshot_id}}"
              - "--reference"
              - "{{job.parameters.reference_snapshot_id}}"
              - "--scenario"
              - "{{job.parameters.scenario}}"
        - task_key: alert
          depends_on:
            - task_key: monitor
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters:
              - "lakehouse"
              - "alert"
              - "--snapshot"
              - "{{job.parameters.snapshot_id}}"
              - "--scenario"
              - "{{job.parameters.scenario}}"

    # Retraining, run by hand when the monitoring stage recommends it. The run is logged to
    # MLflow and registered with the challenger alias; promotion is a separate approved step.
    train_challenger:
      name: foretaksrisiko train challenger
      description: Train and evaluate against the pre-registered plan and register a challenger.
      parameters:
        - name: snapshot_id
          default: ${var.snapshot_id}
        - name: design
          default: retro
        - name: scope
          # population, or sample for the development sample only
          default: population
      email_notifications:
        on_failure:
          - ${var.alert_email}
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: train
          environment_key: default
          python_wheel_task:
            package_name: foretaksrisiko
            entry_point: foretaksrisiko-job
            parameters:
              - "lakehouse"
              - "train"
              - "--snapshot"
              - "{{job.parameters.snapshot_id}}"
              - "--design"
              - "{{job.parameters.design}}"
              - "--scope"
              - "{{job.parameters.scope}}"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # CLI profile created with: databricks auth login --host <workspace> --profile foretaksrisiko
      profile: foretaksrisiko
